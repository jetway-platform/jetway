name: flightdeck
description: A CLI tool for Flutter developers to deploy apps to App Store and Google Play.
version: 0.2.5
repository: https://github.com/yourusername/flightdeck

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    # CLI framework - argument parsing, commands
    args: ^2.4.2

    # Beautiful terminal output
    mason_logger: ^0.3.2

    # YAML parsing for flightdeck.yaml
    yaml: ^3.1.2

    # HTTP client for App Store Connect & Play APIs
    http: ^1.1.0

    # JWT generation for App Store Connect API auth
    dart_jsonwebtoken: ^2.7.1

    # Google APIs for Play Store
    googleapis: ^12.0.0
    googleapis_auth: ^1.4.1

    # File system utilities
    path: ^1.8.3

    # .env file support
    dotenv: ^4.1.0

    # Archive/zip for IPA packaging
    archive: ^3.4.10

    # JSON serialization
    json_annotation: ^4.8.1

dev_dependencies:
    lints: ^3.0.0
    test: ^1.24.0
    build_runner: ^2.4.7
    json_serializable: ^6.7.1
    mockito: ^5.4.4

executables:
    flightdeck: flightdeck
