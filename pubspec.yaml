name: jetway
description: A CLI tool for Flutter developers to deploy apps to App Store and Google Play.
version: 0.2.5
repository: https://github.com/jetway-platform/jetway

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    args: ^2.4.2
    mason_logger: ^0.3.2
    yaml: ^3.1.2
    http: ^1.1.0
    dart_jsonwebtoken: ^2.7.1
    googleapis: ^12.0.0
    googleapis_auth: ^1.4.1
    path: ^1.8.3

dev_dependencies:
    lints: ^3.0.0
    test: ^1.24.0

executables:
    jetway: jetway
